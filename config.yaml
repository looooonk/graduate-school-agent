# Graduate School Agent - Configuration
# API keys are loaded from environment variables, not this file.

models:
  haiku: claude-haiku-4-5-20251001
  sonnet: claude-sonnet-4-6
  local_retrieval: Qwen/Qwen3.6-35B-A3B-FP8

retrieval:
  # Available backends: anthropic_haiku, local_qwen_vllm
  backend: local_qwen_vllm
  max_turns: 25
  max_search_results: 5
  max_page_chars: 30000
  local_model_count: 4
  local_parallel_agents: 4
  local_max_parallel_tool_calls: 8
  local_base_urls:
    - http://127.0.0.1:8001/v1
    - http://127.0.0.1:8002/v1
    - http://127.0.0.1:8003/v1
    - http://127.0.0.1:8004/v1
  local_timeout: 600

judge:
  retry_gap_fill: true
  gap_fill_max_turns: 5

concurrency:
  max_schools_parallel: 8
  max_sonnet_parallel: 8

http:
  timeout: 20
  retries: 2

output:
  dir: output

logs:
  dir: logs

deploy:
  host: 0.0.0.0
  vllm_args:
    - --trust-remote-code
    - --gpu-memory-utilization
    - "0.95"
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --max-num-batched-tokens
    - "32768"
    - --max-num-seqs
    - "256"
    - --kv-cache-dtype
    - fp8_e5m2
  log_dir: logs/vllm
  micromamba_env: graduate-school-agent
  python_version: "3.11"
  system_packages:
    - curl
    - git
    - build-essential
    - tmux
  pip_packages:
    - vllm
